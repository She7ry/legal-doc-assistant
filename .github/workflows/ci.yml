name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -c constraints-py311.txt -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests scripts

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  agent-eval:
    name: Agent evaluation (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - backend
    env:
      DOC_ASSISTANT_CHAT_API_KEY: ${{ secrets.DOC_ASSISTANT_CHAT_API_KEY }}
      DOC_ASSISTANT_EMBEDDING_API_KEY: ${{ secrets.DOC_ASSISTANT_EMBEDDING_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: legal-doc-assistant-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Agent eval credentials
        shell: bash
        run: |
          if [[ -z "$DOC_ASSISTANT_CHAT_API_KEY" || -z "$DOC_ASSISTANT_EMBEDDING_API_KEY" || -z "$LANGSMITH_API_KEY" ]]; then
            echo "::error::Agent evaluation requires Chat, Embedding, and LangSmith credentials."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval dependencies
        run: python -m pip install -c constraints-py311.txt -e ".[dev]"

      - name: Run Agent evaluation
        run: |
          python scripts/run_agent_eval.py \
            --max-concurrency 2 \
            --min-score task_completion=0.8 \
            --min-score requirement_coverage=0.8 \
            --min-score factual_accuracy=0.85 \
            --min-score evidence_faithfulness=0.85 \
            --min-score citation_correctness=0.85 \
            --max-average-latency-seconds 300

  rag-eval:
    name: RAG evaluation (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - backend
    env:
      DOC_ASSISTANT_CHAT_API_KEY: ${{ secrets.DOC_ASSISTANT_CHAT_API_KEY }}
      DOC_ASSISTANT_EMBEDDING_API_KEY: ${{ secrets.DOC_ASSISTANT_EMBEDDING_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check eval credentials
        shell: bash
        run: |
          if [[ -z "$DOC_ASSISTANT_CHAT_API_KEY" || -z "$DOC_ASSISTANT_EMBEDDING_API_KEY" ]]; then
            echo "::error::RAG evaluation requires Chat and Embedding credentials."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval dependencies
        run: python -m pip install -c constraints-py311.txt -e ".[dev]"

      - name: Run RAG evaluation
        run: |
          python scripts/run_rag_eval.py \
            --clean \
            --concurrency 2 \
            --min-score retrieval.at_5.recall=0.8 \
            --min-score generation.citation_accuracy=0.9

      - name: Upload RAG eval report
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: data/eval/latest_report.json
