[project]
name = "legal-doc-assistant"
version = "0.1.0"
description = "A citation-first RAG assistant for contracts, policies, and compliance documents."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic-settings>=2.0,<3.0",
    "langchain-core>=1.0,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-deepseek>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "mcp>=1.28,<2",
    "qdrant-client>=1.15,<2.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "reportlab>=4.0,<5.0",
    "dashscope>=1.20,<2.0",
    "requests>=2.31,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "coverage[toml]>=7.0,<8.0",
    "ruff>=0.8,<1.0",
]
eval = []

[project.scripts]
run-rag-eval = "ai.rag.evaluation.cli:run_eval"
generate-eval-fixtures = "ai.rag.evaluation.cli:generate_fixtures"
docusign-mcp-auth = "ai.mcp.docusign:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_auth: run with the real registered-user authentication dependency"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
